<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Statistics Table</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        table{
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        thead{
            background-color: #1e3a8a;
            color: white;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        tbody tr:nth-child(odd){
            background-color: #f9f9f9;
        }

        tbody tr:nth-child(even){
            background-color: #e5e7eb;
        }

        tbody tr:hover{
            background-color: #c7d2fe;
        }
    </style>
</head>

<body>

    <table>
        
        <thead>
            <tr>
                <th>Player</th>
                <th>Kills</th>
                <th>Assists</th>
                <th>Deaths</th>
                <th>Revives</th>
                <th>Wins</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Hackerman</td>
                <td>10</td>
                <td>5</td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>

            <tr>
                <td>Cool Doggo</td>
                <td>13</td>
                <td>4</td>
                <td>8</td>
                <td>7</td>
                <td>1</td>
            </tr>

            <tr>
                <td>Andrews</td>
                <td>19</td>
                <td>2</td>
                <td>10</td>
                <td>11</td>
                <td>0</td>
            </tr>

            <tr>
                <td>Strawberry</td>
                <td>2</td>
                <td>9</td>
                <td>3</td>
                <td>5</td>
                <td>1</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
